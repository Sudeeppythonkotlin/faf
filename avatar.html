<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your avatar — FAF</title>
  <meta name="theme-color" content="#F4F6FB">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <span class="logo">FAF</span>
  <div id="stepSlot"></div>
  <h1 class="pagehead">Build your avatar</h1>
  <p class="sub">This is how other students will see you. No photos needed.</p>

  <div class="stage">
    <div class="preview" id="preview"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
  <div id="opts"></div>

  <div class="actionbar">
    <div class="row">
      <button class="btn ghost" id="rand" type="button">🎲 Surprise me</button>
      <button class="btn" id="save">Save avatar</button>
    </div>
    <p class="error" id="err" role="alert"></p>
  </div>
</main>
<script type="module">
  import { db, watchUser } from "./firebase.js";
  import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
  import { GROUPS, OPTIONS, defaultAvatar, randomAvatar, renderAvatar } from "./avatar.js";
  import { stepper } from "./ui.js";

  const $ = (id) => document.getElementById(id);
  let cfg = defaultAvatar(), uid = null, tab = "face", complete = false;

  function drawPreview() { $("preview").innerHTML = renderAvatar(cfg); }
  function drawTabs() {
    $("tabs").innerHTML = GROUPS.map(([id, name]) => `<button class="tab" role="tab" aria-selected="${id === tab}" data-t="${id}">${name}</button>`).join("");
  }
  function drawOpts() {
    $("opts").innerHTML = OPTIONS.filter((o) => o.g === tab).map((o) => `
      <span class="lbl">${o.label}</span>
      <div class="chips">${o.colors
        ? o.colors.map((col, i) => `<button type="button" class="swatch ${cfg[o.key] === i ? "on" : ""}" data-k="${o.key}" data-v="${i}" style="background:${col}" aria-label="${o.label} ${i + 1}" aria-pressed="${cfg[o.key] === i}"></button>`).join("")
        : o.opts.map(([id, name]) => `<button type="button" class="chip ${cfg[o.key] === id ? "on" : ""}" data-k="${o.key}" data-v="${id}" aria-pressed="${cfg[o.key] === id}">${name}</button>`).join("")}
      </div>`).join("");
  }
  const drawAll = () => { drawPreview(); drawTabs(); drawOpts(); };

  $("tabs").onclick = (e) => { const b = e.target.closest("[data-t]"); if (b) { tab = b.dataset.t; drawTabs(); drawOpts(); } };
  $("opts").onclick = (e) => {
    const b = e.target.closest("[data-k]"); if (!b) return;
    const o = OPTIONS.find((x) => x.key === b.dataset.k);
    cfg[o.key] = o.colors ? Number(b.dataset.v) : b.dataset.v;
    drawPreview(); drawOpts();
  };
  $("rand").onclick = () => { cfg = randomAvatar(); drawAll(); };

  watchUser(async (u) => {
    if (!u) { location.href = "join.html"; return; }
    uid = u.uid;
    const snap = await getDoc(doc(db, "users", uid));
    const p = snap.exists() ? snap.data() : {};
    complete = !!p.profileComplete;
    if (!complete) $("stepSlot").innerHTML = stepper(2);
    if (p.avatarConfig) cfg = { ...defaultAvatar(), ...p.avatarConfig };
    drawAll();
  });

  $("save").onclick = async () => {
    $("save").disabled = true; $("save").textContent = "Saving...";
    try {
      await setDoc(doc(db, "users", uid), { avatarConfig: cfg, updatedAt: serverTimestamp() }, { merge: true });
      location.href = complete ? "me.html" : "social.html";
    } catch (e) {
      console.error(e); $("err").textContent = "We couldn't save your avatar. Check your connection and try again.";
      $("save").disabled = false; $("save").textContent = "Save avatar";
    }
  };
  drawAll();
</script>
</body>
</html>
