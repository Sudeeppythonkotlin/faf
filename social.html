<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your links — FAF</title>
  <meta name="theme-color" content="#F4F6FB">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FAF">
  <script>window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__bip=e;});</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <span class="logo">FAF</span>
  <div id="stepSlot"></div>
  <h1 class="pagehead">Where can people say hi?</h1>
  <p class="sub">FAF has no chat. Add at least one account, and switch on the ones you want people to see.</p>
  <div id="list"></div>
  <div class="actionbar"><button class="btn" id="save">Save and finish</button><p class="error" id="err" role="alert"></p></div>
</main>
<script type="module">
  import { db, watchUser } from "./firebase.js";
  import { doc, getDoc, getDocs, setDoc, deleteDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
  import { PLATFORMS, normalizeHandle } from "./social.js";
  import { stepper } from "./ui.js";

  const $ = (id) => document.getElementById(id);
  let uid = null, userData = {}, existing = {};

  $("list").innerHTML = PLATFORMS.map((p) => `
    <div class="card">
      <b>${p.icon} ${p.label}</b>
      <label class="lbl" for="h-${p.id}" style="margin-top:8px;font-weight:500">${p.hint}</label>
      <input id="h-${p.id}" placeholder="${p.ph}" autocapitalize="none" autocorrect="off" autocomplete="off">
      <label class="switchrow" style="margin-top:12px"><span>Show on my profile</span><input type="checkbox" id="v-${p.id}" checked></label>
    </div>`).join("");

  watchUser(async (u) => {
    if (!u) { location.href = "join.html"; return; }
    uid = u.uid;
    const us = await getDoc(doc(db, "users", uid));
    userData = us.exists() ? us.data() : {};
    if (!userData.profileComplete) $("stepSlot").innerHTML = stepper(3);
    const snap = await getDocs(collection(db, "users", uid, "socials"));
    snap.forEach((d) => { existing[d.id] = d.data(); const h = $("h-" + d.id), v = $("v-" + d.id); if (h) { h.value = d.data().handle || ""; v.checked = d.data().visible !== false; } });
  });

  $("save").onclick = async () => {
    const err = $("err"); err.textContent = "";
    const entries = [];
    for (const p of PLATFORMS) {
      const raw = $("h-" + p.id).value.trim();
      if (!raw) { entries.push({ p, handle: null }); continue; }
      const handle = normalizeHandle(p.id, raw);
      if (!handle) { $("h-" + p.id).classList.add("bad"); $("h-" + p.id).focus(); return err.textContent = `That ${p.label} username doesn't look right. Use just the username or your profile link.`; }
      $("h-" + p.id).classList.remove("bad");
      entries.push({ p, handle, visible: $("v-" + p.id).checked });
    }
    const filled = entries.filter((e) => e.handle);
    if (!filled.length) return err.textContent = "Add at least one account so people can reach you.";
    if (!filled.some((e) => e.visible)) return err.textContent = "Switch on at least one account. Otherwise nobody can connect with you.";

    $("save").disabled = true; $("save").textContent = "Saving...";
    try {
      for (const e of entries) {
        const ref = doc(db, "users", uid, "socials", e.p.id);
        if (e.handle) await setDoc(ref, { handle: e.handle, visible: e.visible, updatedAt: serverTimestamp() }, { merge: true });
        else if (existing[e.p.id]) await deleteDoc(ref);
      }
      const first = !userData.profileComplete;
      const upd = { profileComplete: true, updatedAt: serverTimestamp() };
      if (first) upd.discoverable = true; // ON the first time; the person controls it in Settings
      await setDoc(doc(db, "users", uid), upd, { merge: true });
      location.href = first ? "home.html?welcome=1" : "me.html";
    } catch (er) {
      console.error(er); err.textContent = "We couldn't save that. Check your connection and try again.";
      $("save").disabled = false; $("save").textContent = "Save and finish";
    }
  };
</script>
</body>
</html>
