<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discover — FAF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="center" style="justify-content:flex-start">
  <a href="home.html" class="logo" style="font-size:40px;text-decoration:none">FAF</a>
  <p class="headline" style="font-size:24px">Meet someone new.</p>
  <p class="muted" style="font-size:14px">You never know who you've crossed paths with.</p>

  <p class="lbl" style="margin-top:22px;text-align:left">WHERE DO YOU WANT TO DISCOVER?</p>
  <div class="modes" id="modes">
    <button class="mode on" data-m="university"><span>🏫</span><b>MY UNIVERSITY</b><i>Students from your university.</i></button>
    <button class="mode" data-m="other"><span>🎓</span><b>OTHER UNIVERSITIES</b><i>Students from universities across India.</i></button>
    <button class="mode" data-m="state"><span>📍</span><b>MY STATE</b><i>Students from universities in your state.</i></button>
  </div>
  <button class="btn big" id="find" disabled>FIND SOMEONE</button>
  <div id="out"></div>
</main>
<script type="module">
  import { db, watchUser } from "./firebase.js";
  import { doc, getDoc, getDocs, setDoc, collection, query, where, orderBy, limit, serverTimestamp, Timestamp }
    from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
  import { findUniversityById, INTERESTS } from "./universities.js";
  import { renderAvatar } from "./avatar.js";
  import { PLATFORMS, normalizeHandle, linkFor } from "./social.js";

  const COOLDOWN_DAYS = 30;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const labels = Object.fromEntries(INTERESTS);
  let uid = null, me = {}, mode = "university";
  let seen = new Set(), blocked = new Set();

  $("modes").addEventListener("click", (e) => {
    const b = e.target.closest(".mode"); if (!b) return;
    setMode(b.dataset.m);
  });
  function setMode(m) {
    mode = m;
    document.querySelectorAll(".mode").forEach((x) => x.classList.toggle("on", x.dataset.m === m));
  }

  watchUser(async (u) => {
    if (!u) { location.href = "join.html"; return; }
    uid = u.uid;
    const snap = await getDoc(doc(db, "users", uid));
    me = snap.exists() ? snap.data() : {};
    if (!me.profileComplete) { location.href = "home.html"; return; }
    if (!me.discoverable) $("out").innerHTML = `<p class="muted" style="margin-top:16px">Your profile is hidden, so you can't discover people either. Turn "Show me" back on in Settings.</p>`;
    await loadContext();
    $("find").disabled = false;
  });

  async function loadContext() {
    seen = new Set(); blocked = new Set();
    const s = await getDocs(query(collection(db, "users", uid, "seen"), where("expiresAt", ">", Timestamp.now())));
    s.forEach((d) => seen.add(d.id));
    const b1 = await getDocs(collection(db, "users", uid, "blocks")); b1.forEach((d) => blocked.add(d.id));
    const b2 = await getDocs(collection(db, "users", uid, "blockedBy")); b2.forEach((d) => blocked.add(d.id));
  }

  // Fetch a batch of discovery cards near a random point (r) in the pool.
  async function fetchBatch(r, up) {
    const base = collection(db, "pool");
    const field = mode === "state" ? "stateId" : "universityId";
    const val = mode === "state" ? me.stateId : me.universityId;
    try {
      const q = mode === "other"
        ? query(base, where("rand", up ? ">=" : "<", r), orderBy("rand"), limit(60))
        : query(base, where(field, "==", val), where("rand", up ? ">=" : "<", r), orderBy("rand"), limit(40));
      return (await getDocs(q)).docs;
    } catch (e) {
      if (e.code === "failed-precondition") {
        // Index still missing/building: fall back to a plain query (still random, just less efficient)
        console.warn("Create the index using this link:", e.message);
        return (await getDocs(query(base, where(field, "==", val), limit(60)))).docs;
      }
      throw e;
    }
  }

  function eligible(c) {
    if (c.id === uid || seen.has(c.id) || blocked.has(c.id)) return false;
    const d = c.data(); if (!(d.age >= 18)) return false;
    if (mode === "university") return d.universityId === me.universityId;
    if (mode === "state") return d.stateId === me.stateId;
    return d.universityId !== me.universityId;
  }

  async function findSomeone() {
    $("find").disabled = true; $("find").textContent = "Finding someone new...";
    $("out").innerHTML = `<div class="spin"></div>`;
    try {
      const r = Math.random();
      let pool = (await fetchBatch(r, true)).filter(eligible);
      if (!pool.length) pool = (await fetchBatch(r, false)).filter(eligible);
      if (!pool.length) { showEmpty(); return; }
      const pick = pool[Math.floor(Math.random() * pool.length)];
      await setDoc(doc(db, "users", uid, "seen", pick.id), {
        at: serverTimestamp(), expiresAt: Timestamp.fromMillis(Date.now() + COOLDOWN_DAYS * 864e5),
      });
      seen.add(pick.id);
      showResult(pick.data());
    } catch (e) {
      console.error(e);
      $("out").innerHTML = `<p class="error">Something went wrong. Please try again.</p>`;
    } finally {
      $("find").disabled = false; $("find").textContent = "FIND SOMEONE";
    }
  }
  $("find").onclick = findSomeone;

  function showEmpty() {
    const alt = mode === "university" ? ["state", "other"] : mode === "state" ? ["other"] : [];
    const names = { state: "MY STATE", other: "OTHER UNIVERSITIES" };
    $("out").innerHTML = `
      <div class="card" style="text-align:center">
        <b>Looks like your discovery pool is a little small.</b>
        <span>${alt.length ? "Try another discovery mode to meet more students." : "Nobody new right now. Come back soon as more students join."}</span>
        <div style="margin-top:12px">${alt.map((m) => `<button class="btn ghost" data-switch="${m}">${names[m]}</button>`).join(" ")}</div>
      </div>`;
    $("out").querySelectorAll("[data-switch]").forEach((b) => b.onclick = () => { setMode(b.dataset.switch); findSomeone(); });
  }

  function showResult(d) {
    const uni = findUniversityById(d.universityId);
    const mine = new Set(me.interests || []);
    const theirs = (d.interests || []).filter((i) => labels[i]);
    const shared = theirs.filter((i) => mine.has(i));
    const links = Object.entries(d.socials || {}).map(([pid, handle]) => {
      const pl = PLATFORMS.find((x) => x.id === pid); const h = pl && normalizeHandle(pid, handle);
      if (!h) return "";
      const url = linkFor(pid, h);
      return url
        ? `<a class="btn ghost conn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${pl.icon} ${pl.label}</a>`
        : `<span class="btn ghost conn">${pl.icon} ${pl.label}: <b>${esc(h)}</b></span>`;
    }).join("");
    $("out").innerHTML = `
      <div class="card reveal" style="text-align:center">
        <p class="muted" style="margin:0 0 8px;font-weight:700">YOU FOUND SOMEONE</p>
        <div class="preview">${renderAvatar(d.avatarConfig)}</div>
        <b style="margin-top:12px;font-size:20px">${esc(d.displayName)}, ${esc(d.age)}</b>
        <span>${esc(d.collegeName)}<br>${esc(uni ? uni.name : "")}${uni ? " · " + esc(uni.state) : ""}</span>
        <p style="margin-top:10px;font-size:14px">${theirs.map((i) => esc(labels[i])).join(" · ")}</p>
        ${shared.length ? `<p style="font-size:14px;color:var(--violet);font-weight:700">You both like ${shared.map((i) => esc(labels[i])).join(", ")}</p>` : ""}
        ${d.bio ? `<p class="muted" style="font-size:14px">${esc(d.bio)}</p>` : ""}
        <p class="muted" style="font-size:13px">You might have crossed paths.</p>
        <p class="lbl" style="margin-top:14px">CONNECT</p>
        <div>${links || '<span class="muted" style="font-size:13px">No links shared.</span>'}</div>
      </div>
      <p class="muted" style="font-size:13px;margin-top:14px">Press FIND SOMEONE above to meet someone else.</p>`;
    $("out").scrollIntoView({ behavior: "smooth", block: "start" });
  }
</script>
</body>
</html>
