<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings — FAF</title>
  <meta name="theme-color" content="#F4F6FB">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <span class="logo">FAF</span>
  <h1 class="pagehead">Settings</h1>

  <div class="card" style="margin-top:18px">
    <label class="switchrow">
      <span><b>Show me to other students</b><span>When this is off, nobody can find you, and you can't find others either.</span></span>
      <input type="checkbox" id="disc" disabled aria-label="Show me to other students">
    </label>
    <p class="hint" id="discMsg"></p>
  </div>

  <div class="list">
    <a href="profile.html"><span>✏️</span>Edit profile</a>
    <a href="avatar.html"><span>🙂</span>Edit avatar</a>
    <a href="social.html"><span>🔗</span>Social links</a>
    <a href="legal.html#safety"><span>🛡️</span>Safety tips</a>
    <a href="legal.html#privacy"><span>🔒</span>Privacy policy</a>
    <a href="legal.html#terms"><span>📄</span>Terms</a>
    <a href="admin.html" id="adminLink" style="display:none"><span>🛠️</span>Admin</a>
    <a href="#" id="out"><span>🚪</span>Log out</a>
  </div>

  <div class="card danger">
    <b>Delete account</b>
    <span>This permanently deletes your profile, avatar, links and history. It can't be undone.</span>
    <button class="btn ghost" id="del" style="margin-top:12px;border-color:#B3261E;color:#B3261E;box-shadow:3px 3px 0 #B3261E">Delete my account</button>
    <p class="error" id="delErr" role="alert"></p>
  </div>
</main>
<script type="module">
  import { auth, db, watchUser, logout } from "./firebase.js";
  import { doc, getDoc, getDocs, setDoc, deleteDoc, collection, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
  import { GoogleAuthProvider, reauthenticateWithPopup, deleteUser }
    from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
  import { syncPool } from "./pool.js";
  import { mountNav, toast } from "./ui.js";

  mountNav("settings");
  const $ = (id) => document.getElementById(id);
  let uid = null, me = {}, socialDocs = [];

  watchUser(async (u) => {
    if (!u) { location.href = "join.html"; return; }
    uid = u.uid;
    const snap = await getDoc(doc(db, "users", uid));
    me = snap.exists() ? snap.data() : {};
    const s = await getDocs(collection(db, "users", uid, "socials"));
    socialDocs = []; s.forEach((d) => socialDocs.push({ id: d.id, data: d.data() }));
    $("disc").checked = me.discoverable === true;
    $("disc").disabled = !me.profileComplete;
    $("discMsg").textContent = me.profileComplete ? (me.discoverable ? "You're visible to other students." : "You're hidden.") : "Finish your profile first (avatar and links).";
    try { const a = await getDoc(doc(db, "admins", uid)); if (a.exists()) $("adminLink").style.display = "flex"; } catch (e) {}
  });

  $("disc").onchange = async () => {
    const on = $("disc").checked; $("disc").disabled = true; $("discMsg").textContent = "Saving…";
    try {
      await setDoc(doc(db, "users", uid), { discoverable: on, updatedAt: serverTimestamp() }, { merge: true });
      me.discoverable = on;
      await syncPool(db, uid, me, socialDocs);
      $("discMsg").textContent = on ? "You're visible to other students." : "You're hidden.";
      toast(on ? "You're visible again." : "You're hidden from discovery.");
    } catch (e) { console.error(e); $("disc").checked = !on; $("discMsg").textContent = "We couldn't save that. Try again."; }
    $("disc").disabled = false;
  };

  $("out").onclick = async (e) => { e.preventDefault(); await logout(); location.href = "index.html"; };

  $("del").onclick = async () => {
    const err = $("delErr"); err.textContent = "";
    if (prompt("This permanently deletes your FAF account.\nType DELETE to confirm.") !== "DELETE") return;
    $("del").disabled = true; $("del").textContent = "Deleting…";
    try {
      await reauthenticateWithPopup(auth.currentUser, new GoogleAuthProvider());
      await deleteDoc(doc(db, "pool", uid)); // stop being discoverable immediately
      for (const sub of ["socials", "seen", "usage"]) {
        const snap = await getDocs(collection(db, "users", uid, sub));
        for (const d of snap.docs) await deleteDoc(d.ref);
      }
      await deleteDoc(doc(db, "users", uid));
      await deleteUser(auth.currentUser);
      location.href = "index.html";
    } catch (e) {
      console.error(e);
      err.textContent = e.code === "auth/popup-closed-by-user" ? "Deletion cancelled." : "We couldn't delete the account. Try again.";
      $("del").disabled = false; $("del").textContent = "Delete my account";
    }
  };
</script>
</body>
</html>
