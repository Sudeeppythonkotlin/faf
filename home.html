<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="center" id="app"><p class="muted">Loading...</p></main>
<script type="module">
  import { db, watchUser, logout } from "./firebase.js";
  import { doc, getDoc, getDocs, setDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
  import { syncPool } from "./pool.js";
  import { findUniversityById, INTERESTS } from "./universities.js";
  import { renderAvatar } from "./avatar.js";
  import { PLATFORMS } from "./social.js";
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  watchUser(async (u) => {
    if (!u) { location.href = "join.html"; return; }
    const snap = await getDoc(doc(db, "users", u.uid));
    const p = snap.exists() ? snap.data() : {};
    if (!p.universityId) { location.href = "profile.html"; return; }
    if (!p.avatarConfig) { location.href = "avatar.html"; return; }
    const socials = await getDocs(collection(db, "users", u.uid, "socials"));
    if (socials.empty) { location.href = "social.html"; return; }

    // make sure my public discovery copy exists / is current
    const poolSnap = await getDoc(doc(db, "pool", u.uid));
    if (!poolSnap.exists()) { try { await syncPool(db, u.uid); } catch (e) { console.error(e); } }

    const uni = findUniversityById(p.universityId);
    const labels = Object.fromEntries(INTERESTS);
    const chips = []; socials.forEach((d) => { const pl = PLATFORMS.find((x) => x.id === d.id); if (pl) chips.push(`${pl.icon} ${pl.label}${d.data().visible === false ? " (hidden)" : ""}`); });

    document.getElementById("app").innerHTML = `
      <div class="logo" style="font-size:48px">FAF</div>
      <div class="card" style="text-align:center">
        <div class="preview sm">${renderAvatar(p.avatarConfig)}</div>
        <b style="margin-top:10px">${esc(p.displayName)}, ${esc(p.age)}</b>
        <span>${esc(p.collegeName)}<br>${esc(uni ? uni.name : "")}${uni ? " · " + esc(uni.state) : ""}</span>
        <p style="margin-top:10px;font-size:14px">${(p.interests || []).map((i) => esc(labels[i] || i)).join(" · ")}</p>
        ${p.bio ? `<p class="muted" style="font-size:14px">${esc(p.bio)}</p>` : ""}
        <p style="margin-top:10px;font-size:14px">${chips.join("<br>")}</p>
      </div>
      <a class="btn find" href="discover.html">FIND SOMEONE</a>
      <label class="check" style="margin-top:16px"><input type="checkbox" id="disc" ${p.discoverable ? "checked" : ""}><span>Show me to other students</span></label>
      <p class="headline" style="font-size:18px;margin-top:20px">Day 4 done ✅</p>
      <div style="margin-top:16px">
        <a class="btn ghost" href="profile.html">Edit profile</a>
        <a class="btn ghost" href="avatar.html">Edit avatar</a>
        <a class="btn ghost" href="social.html">Edit links</a>
      </div>
      <div><button class="btn ghost" id="out" style="margin-top:12px">Log out</button></div>`;
    document.getElementById("disc").onchange = async (e) => {
      const on = e.target.checked; e.target.disabled = true;
      try { await setDoc(doc(db, "users", u.uid), { discoverable: on, updatedAt: serverTimestamp() }, { merge: true }); await syncPool(db, u.uid); }
      catch (er) { console.error(er); e.target.checked = !on; }
      e.target.disabled = false;
    };
    document.getElementById("out").onclick = async () => { await logout(); location.href = "index.html"; };
  });
</script>
</body>
</html>
