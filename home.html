<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAF</title>
  <meta name="theme-color" content="#F4F6FB">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <span class="logo">FAF</span>
  <h1 class="pagehead" id="hello">Meet someone new.</h1>
  <p class="sub">You never know who you've crossed paths with.</p>

  <span class="lbl">Where do you want to look?</span>
  <div class="modes" id="modes" role="group" aria-label="Where to look">
    <button class="mode" data-m="university" aria-pressed="true"><span class="ico">🏫</span><b>My university</b><i>Students from your university</i></button>
    <button class="mode" data-m="other" aria-pressed="false"><span class="ico">🎓</span><b>Other universities</b><i>Students from across India</i></button>
    <button class="mode" data-m="state" aria-pressed="false"><span class="ico">📍</span><b>My state</b><i>Students from universities in your state</i></button>
  </div>
  <button class="btn big" id="find" disabled>Find someone</button>
  <div id="out" aria-live="polite"></div>
</main>
<script type="module">
  import { db, watchUser } from "./firebase.js";
  import { doc, getDoc, getDocs, setDoc, collection, query, where, orderBy, limit, serverTimestamp, Timestamp, increment }
    from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
  import { PLATFORMS, normalizeHandle, linkFor } from "./social.js";
  import { syncPool } from "./pool.js";
  import { esc, LABELS, mountNav, passHtml, toast } from "./ui.js";
  import { track } from "./analytics.js";
  import { adHtml, mountAd } from "./ads.js";

  mountNav("home");
  const COOLDOWN_DAYS = 30;
  const DAILY_LIMIT = 40; // max presses per day (soft limit)
  const dayKey = () => new Date().toLocaleDateString("en-CA");
  const MODE_COUNTER = { university: "mUniversity", other: "mOther", state: "mState" };
  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  let uid = null, me = {}, mode = "university";
  let seen = new Set(), usedToday = 0, shownCount = 0, hasResult = false, spinTimer = null;

  $("modes").addEventListener("click", (e) => { const b = e.target.closest(".mode"); if (b) setMode(b.dataset.m); });
  function setMode(m) { mode = m; document.querySelectorAll(".mode").forEach((x) => x.setAttribute("aria-pressed", x.dataset.m === m)); }

  watchUser(async (u) => {
    if (!u) { location.href = "join.html"; return; }
    uid = u.uid;
    const snap = await getDoc(doc(db, "users", uid));
    me = snap.exists() ? snap.data() : {};
    if (me.accountStatus && me.accountStatus !== "active") {
      $("find").style.display = "none"; $("modes").style.display = "none";
      $("out").innerHTML = `<div class="card"><b>Your account isn't active right now.</b><span>If you think this is a mistake, please contact us.</span></div>`;
      return;
    }
    if (!me.universityId) { location.href = "profile.html"; return; }
    if (!me.avatarConfig) { location.href = "avatar.html"; return; }
    const socials = await getDocs(collection(db, "users", uid, "socials"));
    if (socials.empty) { location.href = "social.html"; return; }

    const socialDocs = []; socials.forEach((d) => socialDocs.push({ id: d.id, data: d.data() }));
    try { await syncPool(db, uid, me, socialDocs); } catch (e) { console.error("pool sync failed", e); }

    if (me.displayName) $("hello").textContent = `Hey ${me.displayName}, who's next?`;
    if (new URLSearchParams(location.search).get("welcome")) { toast("You're in! Press Find someone to meet your first student."); history.replaceState(null, "", "home.html"); }
    if (me.discoverable === false) $("out").innerHTML = `<p class="hint" style="margin-top:16px">You're hidden right now, so you can't find people either. Turn on "Show me to other students" in Settings.</p>`;
    await loadContext();
    $("find").disabled = false;
  });

  async function loadContext() {
    seen = new Set();
    const s = await getDocs(query(collection(db, "users", uid, "seen"), where("expiresAt", ">", Timestamp.now())));
    s.forEach((d) => seen.add(d.id));
    const us = await getDoc(doc(db, "users", uid, "usage", dayKey()));
    usedToday = us.exists() ? (us.data().count || 0) : 0;
  }

  async function fetchBatch(r, up) {
    const base = collection(db, "pool");
    const field = mode === "state" ? "stateId" : "universityId";
    const val = mode === "state" ? me.stateId : me.universityId;
    try {
      const q = mode === "other"
        ? query(base, where("rand", up ? ">=" : "<", r), orderBy("rand"), limit(60))
        : query(base, where(field, "==", val), where("rand", up ? ">=" : "<", r), orderBy("rand"), limit(40));
      return (await getDocs(q)).docs;
    } catch (e) {
      if (e.code === "failed-precondition") {
        console.warn("Create the index using this link:", e.message);
        return (await getDocs(query(base, where(field, "==", val), limit(60)))).docs;
      }
      throw e;
    }
  }

  function eligible(c) {
    if (c.id === uid || seen.has(c.id)) return false;
    const d = c.data(); if (!(d.age >= 18)) return false;
    if (mode === "university") return d.universityId === me.universityId;
    if (mode === "state") return d.stateId === me.stateId;
    return d.universityId !== me.universityId;
  }

  const LOOKING = { university: ["Looking around your campus…", "Checking the canteen…", "Peeking into the library…"], other: ["Looking across India…", "Checking other campuses…", "Asking around…"], state: ["Looking around your state…", "Checking nearby campuses…", "Asking around…"] };
  function showLoading() {
    const lines = LOOKING[mode]; let i = 0;
    $("out").innerHTML = `<div class="skelpass"><div class="pass-band"></div><div class="pass-av"></div><div class="line"></div><div class="line s"></div><p id="looking">${lines[0]}</p></div>`;
    clearInterval(spinTimer);
    spinTimer = setInterval(() => { i = (i + 1) % lines.length; const el = $("looking"); if (el) el.textContent = lines[i]; }, 900);
  }

  async function findSomeone() {
    if (me.discoverable === false) { toast('Turn on "Show me to other students" in Settings first.'); return; }
    if (usedToday >= DAILY_LIMIT) { $("out").innerHTML = `<div class="card"><b>You've found a lot of people today.</b><span>Come back tomorrow for more.</span></div>`; return; }
    usedToday++;
    setDoc(doc(db, "users", uid, "usage", dayKey()), { count: increment(1) }, { merge: true }).catch(() => {});
    track("find_someone_clicked", hasResult ? ["finds", MODE_COUNTER[mode], "elseClicks"] : ["finds", MODE_COUNTER[mode]], { mode });
    $("find").disabled = true; $("find").textContent = "Looking…";
    showLoading();
    try {
      const work = (async () => {
        const r = Math.random();
        let pool = (await fetchBatch(r, true)).filter(eligible);
        if (!pool.length) pool = (await fetchBatch(r, false)).filter(eligible);
        return pool;
      })();
      const [pool] = await Promise.all([work, sleep(900)]); // a short pause makes the reveal feel intentional
      clearInterval(spinTimer);
      if (!pool.length) { hasResult = false; track("discovery_empty", ["empty"], { mode }); showEmpty(); return; }
      const pick = pool[Math.floor(Math.random() * pool.length)];
      await setDoc(doc(db, "users", uid, "seen", pick.id), { at: serverTimestamp(), expiresAt: Timestamp.fromMillis(Date.now() + COOLDOWN_DAYS * 864e5) });
      seen.add(pick.id);
      hasResult = true; shownCount++;
      track("discovery_success", ["success"], { mode });
      showResult(pick.data());
    } catch (e) {
      clearInterval(spinTimer); console.error(e);
      $("out").innerHTML = `<div class="card"><b>That didn't work.</b><span>Check your connection and press the button again.</span></div>`;
    } finally {
      $("find").disabled = false; $("find").textContent = hasResult ? "Find someone else" : "Find someone";
    }
  }
  $("find").onclick = findSomeone;

  function showEmpty() {
    const alt = mode === "university" ? ["state", "other"] : mode === "state" ? ["other"] : [];
    const names = { state: "My state", other: "Other universities" };
    $("out").innerHTML = `
      <div class="card reveal" style="text-align:center">
        <b>${alt.length ? "Quiet around here." : "You've met everyone for now."}</b>
        <span>${alt.length ? "Not many students here yet. Try looking somewhere wider." : "Come back soon, more students are joining."}</span>
        <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${alt.map((m) => `<button class="btn ghost" data-switch="${m}">Try ${names[m].toLowerCase()}</button>`).join("")}</div>
      </div>
      <p class="caption">The more friends join, the better this gets.</p>
      <div style="text-align:center;margin-top:8px"><button class="btn ghost" id="share">📣 Invite friends</button></div>`;
    $("out").querySelectorAll("[data-switch]").forEach((b) => b.onclick = () => { setMode(b.dataset.switch); findSomeone(); });
    $("share").onclick = share;
  }

  function share() {
    const text = "I'm finding students on FAF. Who will you find?";
    const url = location.origin;
    if (navigator.share) navigator.share({ title: "FAF", text, url }).catch(() => {});
    else navigator.clipboard.writeText(text + " " + url).then(() => toast("Link copied. Paste it to your friends!"));
  }

  function showResult(d) {
    const mine = new Set(me.interests || []);
    const shared = (d.interests || []).filter((i) => LABELS[i] && mine.has(i));
    const links = Object.entries(d.socials || {}).map(([pid, handle]) => {
      const pl = PLATFORMS.find((x) => x.id === pid); const h = pl && normalizeHandle(pid, handle);
      if (!h) return "";
      const url = linkFor(pid, h);
      return url
        ? `<a class="conn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${pl.icon} Open on ${pl.label}</a>`
        : `<div class="conn plain">${pl.icon} ${pl.label}: <b>${esc(h)}</b></div>`;
    }).join("");
    $("out").innerHTML = passHtml(d, { shared, label: "Campus pass", links: `<p class="lbl">Say hi on</p><div id="conns">${links || '<p class="hint">No links shared.</p>'}</div>` }) +
      `<p class="caption">You might have crossed paths.</p>
       <div style="text-align:center;margin-top:6px"><button class="btn ghost" id="share">📣 Share FAF</button></div>
       ${shownCount % 3 === 0 ? adHtml() : ""}`;
    $("share").onclick = share;
    $("conns").onclick = (e) => { if (e.target.closest(".conn")) track("external_social_clicked", ["connectClicks"]); };
    if (shownCount % 3 === 0) mountAd();
    $("out").scrollIntoView({ behavior: "smooth", block: "start" });
  }
</script>
</body>
</html>
