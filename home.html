<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAF</title>
  <meta name="theme-color" content="#EEF0F8">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FAF">
  <script>window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__bip=e;});</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <span class="logo">faf</span>
  <h1 class="pagehead" id="hello">Meet someone new.</h1>
  <p class="sub">You never know who you've crossed paths with.</p>

  <div class="banner" id="installBanner" hidden>
    <span class="bico" data-i="download" data-s="20"></span>
    <div><b>Get the FAF app</b><span>Add it to your home screen in one tap.</span></div>
    <button class="btn ghost" data-install type="button">Install</button>
    <button class="x" id="bannerX" aria-label="Dismiss" type="button" data-i="x" data-s="14"></button>
  </div>

  <span class="lbl">Where do you want to look?</span>
  <div class="modes" id="modes" role="group" aria-label="Where to look">
    <button class="mode" data-m="university" aria-pressed="true"><span class="ico" data-i="building"></span><span><b>My university</b><i>Students from your university</i></span></button>
    <button class="mode" data-m="other" aria-pressed="false"><span class="ico" data-i="globe"></span><span><b>Other universities</b><i>Students from across India</i></span></button>
    <button class="mode" data-m="state" aria-pressed="false"><span class="ico" data-i="pin"></span><span><b>My state</b><i>Students from universities in your state</i></span></button>
  </div>
  <button class="btn big" id="find" disabled>Find someone</button>
  <div id="out" aria-live="polite"></div>
</main>
<script type="module">
  import { db, watchUser } from "./firebase.js";
  import { doc, getDoc, getDocs, setDoc, collection, query, where, orderBy, limit, serverTimestamp, Timestamp, increment }
    from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
  import { PLATFORMS, normalizeHandle, linkFor } from "./social.js";
  import { syncPool } from "./pool.js";
  import { esc, LABELS, mountNav, passHtml, toast, badge } from "./ui.js";
  import { mark, icon, trackEyes } from "./brand.js";
  import { track } from "./analytics.js";
  import { adHtml, mountAd } from "./ads.js";
  import { isStandalone } from "./install.js";

  mountNav("home");
  const COOLDOWN_DAYS = 30;
  const DAILY_LIMIT = 100; // profiles shown per day (soft limit)
  const dayKey = () => new Date().toLocaleDateString("en-CA");
  const MODE_COUNTER = { university: "mUniversity", other: "mOther", state: "mState" };
  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  let uid = null, me = {}, mode = "university";
  let seen = new Set(), usedToday = 0, shownCount = 0, spinTimer = null;
  let deck = [], current = null, sessionOn = false, loading = null, busy = false;

  // ---------- mode cards ----------
  const paintMode = () => document.querySelectorAll(".mode").forEach((x) => x.setAttribute("aria-pressed", x.dataset.m === mode));
  $("modes").addEventListener("click", (e) => {
    const b = e.target.closest(".mode"); if (!b || b.dataset.m === mode) return;
    mode = b.dataset.m; paintMode();
    if (sessionOn) startSession(); // changing where you look starts a fresh run
  });

  // ---------- load the signed-in user ----------
  watchUser(async (u) => {
    if (!u) { location.href = "welcome.html"; return; }
    uid = u.uid;
    const snap = await getDoc(doc(db, "users", uid));
    me = snap.exists() ? snap.data() : {};
    if (me.accountStatus && me.accountStatus !== "active") {
      $("find").style.display = "none"; $("modes").style.display = "none";
      $("out").innerHTML = `<div class="card"><b>Your account isn't active right now.</b><span>If you think this is a mistake, please contact us.</span></div>`;
      return;
    }
    if (!me.universityId) { location.href = "profile.html"; return; }
    if (!me.avatarConfig) { location.href = "avatar.html"; return; }
    const socials = await getDocs(collection(db, "users", uid, "socials"));
    if (socials.empty) { location.href = "social.html"; return; }

    const socialDocs = []; socials.forEach((d) => socialDocs.push({ id: d.id, data: d.data() }));
    try { await syncPool(db, uid, me, socialDocs); } catch (e) { console.error("pool sync failed", e); }

    if (me.displayName) $("hello").textContent = `Hey ${me.displayName}, who's next?`;
    if (new URLSearchParams(location.search).get("welcome")) { toast("You're in! Press Find someone to meet your first student."); history.replaceState(null, "", "home.html"); }
    if (me.discoverable === false) $("out").innerHTML = `<p class="hint" style="margin-top:16px">You're hidden right now, so you can't find people either. Turn on "Show me to other students" in Settings.</p>`;
    // gentle one-time nudge to install the app (hidden for 14 days if dismissed, never shown inside the app)
    try {
      const dismissed = Number(localStorage.getItem("faf_install_dismissed") || 0);
      if (!isStandalone() && Date.now() - dismissed > 14 * 864e5) $("installBanner").hidden = false;
      $("bannerX").onclick = () => { $("installBanner").hidden = true; localStorage.setItem("faf_install_dismissed", String(Date.now())); };
    } catch (e) {}
    await loadContext();
    $("find").disabled = false;
  });

  async function loadContext() {
    seen = new Set();
    const s = await getDocs(query(collection(db, "users", uid, "seen"), where("expiresAt", ">", Timestamp.now())));
    s.forEach((d) => seen.add(d.id));
    const us = await getDoc(doc(db, "users", uid, "usage", dayKey()));
    usedToday = us.exists() ? (us.data().count || 0) : 0;
  }

  // ---------- finding people ----------
  async function fetchBatch(r, up) {
    const base = collection(db, "pool");
    const field = mode === "state" ? "stateId" : "universityId";
    const val = mode === "state" ? me.stateId : me.universityId;
    try {
      const q = mode === "other"
        ? query(base, where("rand", up ? ">=" : "<", r), orderBy("rand"), limit(60))
        : query(base, where(field, "==", val), where("rand", up ? ">=" : "<", r), orderBy("rand"), limit(40));
      return (await getDocs(q)).docs;
    } catch (e) {
      if (e.code === "failed-precondition") {
        console.warn("Create the index using this link:", e.message);
        return (await getDocs(query(base, where(field, "==", val), limit(60)))).docs;
      }
      throw e;
    }
  }

  function eligible(c) {
    if (c.id === uid || seen.has(c.id)) return false;
    const d = c.data(); if (!(d.age >= 18)) return false;
    if (mode === "university") return d.universityId === me.universityId;
    if (mode === "state") return d.stateId === me.stateId;
    return d.universityId !== me.universityId;
  }

  // keeps a shuffled queue of eligible students; refills itself from a new random spot in the pool
  function loadDeck() {
    if (loading) return loading;
    loading = (async () => {
      const have = new Set(deck.map((c) => c.id)); if (current) have.add(current.id);
      const r = Math.random();
      let docs = (await fetchBatch(r, true)).filter(eligible);
      if (docs.length < 8) docs = docs.concat((await fetchBatch(r, false)).filter(eligible));
      const uniq = new Map(); docs.forEach((d) => { if (!have.has(d.id)) uniq.set(d.id, d); });
      deck = deck.concat(shuffle([...uniq.values()]));
    })().finally(() => { loading = null; });
    return loading;
  }

  const LOOKING = { university: ["Looking around your campus…", "Checking the canteen…", "Peeking into the library…"], other: ["Looking across India…", "Checking other campuses…", "Asking around…"], state: ["Looking around your state…", "Checking nearby campuses…", "Asking around…"] };
  function showLoading() {
    const lines = LOOKING[mode]; let i = 0;
    $("out").innerHTML = `<div class="looking"><div class="mark-wrap">${mark("look")}</div><p id="looking">${lines[0]}</p><div class="barbar"></div></div>`;
    clearInterval(spinTimer);
    spinTimer = setInterval(() => { i = (i + 1) % lines.length; const el = $("looking"); if (el) el.textContent = lines[i]; }, 900);
  }

  // press "Find someone": starts a run. After that, swipe (or press Next student) for each new person.
  async function startSession() {
    if (me.discoverable === false) { toast('Turn on "Show me to other students" in Settings first.'); return; }
    if (usedToday >= DAILY_LIMIT) { limitMsg(); return; }
    track("find_someone_clicked", ["finds", MODE_COUNTER[mode]], { mode });
    sessionOn = true; deck = []; current = null; busy = false;
    $("find").disabled = true; $("find").textContent = "Looking…";
    showLoading();
    try {
      await Promise.all([loadDeck(), sleep(900)]); // a short pause makes the first reveal feel intentional
      clearInterval(spinTimer);
      await showNext();
    } catch (e) {
      clearInterval(spinTimer); console.error(e); sessionOn = false;
      $("out").innerHTML = `<div class="card"><b>That didn't work.</b><span>Check your connection and press the button again.</span></div>`;
    } finally {
      $("find").disabled = false; $("find").textContent = current ? "Next student" : "Find someone";
    }
  }

  async function showNext() {
    if (usedToday >= DAILY_LIMIT) { current = null; limitMsg(); return; }
    if (!deck.length) { try { await loadDeck(); } catch (e) { console.error(e); } }
    if (!deck.length) { current = null; track("discovery_empty", ["empty"], { mode }); showEmpty(); return; }
    current = deck.shift();
    usedToday++; shownCount++;
    seen.add(current.id);
    setDoc(doc(db, "users", uid, "seen", current.id), { at: serverTimestamp(), expiresAt: Timestamp.fromMillis(Date.now() + COOLDOWN_DAYS * 864e5) }).catch(() => {});
    setDoc(doc(db, "users", uid, "usage", dayKey()), { count: increment(1) }, { merge: true }).catch(() => {});
    track("discovery_success", ["success"], { mode });
    renderCard(current.data());
    if (deck.length <= 2) loadDeck().catch(() => {}); // top up quietly in the background
  }

  // move to the next person (called by swipe, arrow keys or the button)
  async function advance(dir = 1) {
    if (!sessionOn || !current || busy) return;
    busy = true;
    track("find_someone_else_clicked", ["elseClicks"], { mode });
    const el = $("card");
    if (el) { el.style.transition = "transform .25s ease-in, opacity .25s"; el.style.transform = `translateX(${dir * window.innerWidth}px) rotate(${dir * 18}deg)`; el.style.opacity = "0"; await sleep(230); }
    try { await showNext(); } finally { busy = false; $("find").textContent = current ? "Next student" : "Find someone"; }
  }

  $("find").onclick = () => { if (sessionOn && current) advance(1); else startSession(); };
  document.addEventListener("keydown", (e) => {
    if (!sessionOn || !current || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === "ArrowRight") advance(1); else if (e.key === "ArrowLeft") advance(-1);
  });

  // ---------- messages ----------
  function limitMsg() {
    $("out").innerHTML = `<div class="card reveal"><b>You've met a lot of people today.</b><span>Come back tomorrow for more.</span></div>`;
  }
  function showEmpty() {
    const alt = mode === "university" ? ["state", "other"] : mode === "state" ? ["other"] : [];
    const names = { state: "My state", other: "Other universities" };
    const met = shownCount > 0;
    $("out").innerHTML = `
      <div class="card reveal" style="text-align:center">
        <b>${met ? "You've seen everyone here for now." : alt.length ? "Quiet around here." : "Nobody new right now."}</b>
        <span>${alt.length ? "Try looking somewhere wider to meet more students." : "Come back soon, more students are joining."}</span>
        <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${alt.map((m) => `<button class="btn ghost" data-switch="${m}">Try ${names[m].toLowerCase()}</button>`).join("")}</div>
      </div>
      <p class="caption">The more friends join, the better this gets.</p>
      <div style="text-align:center;margin-top:8px"><button class="btn ghost" id="share">${icon("share", 18)} Invite friends</button></div>`;
    $("out").querySelectorAll("[data-switch]").forEach((b) => b.onclick = () => { mode = b.dataset.switch; paintMode(); startSession(); });
    $("share").onclick = share;
    $("find").textContent = "Find someone";
  }

  function share() {
    const text = "I'm finding students on FAF. Who will you find?";
    const url = location.origin;
    if (navigator.share) navigator.share({ title: "FAF", text, url }).catch(() => {});
    else navigator.clipboard.writeText(text + " " + url).then(() => toast("Link copied. Paste it to your friends!"));
  }

  // ---------- the card + swiping ----------
  function renderCard(d) {
    const mine = new Set(me.interests || []);
    const shared = (d.interests || []).filter((i) => LABELS[i] && mine.has(i));
    const links = Object.entries(d.socials || {}).map(([pid, handle]) => {
      const pl = PLATFORMS.find((x) => x.id === pid); const h = pl && normalizeHandle(pid, handle);
      if (!h) return "";
      const url = linkFor(pid, h);
      return url
        ? `<a class="conn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${badge(pl.id, pl.mono)} Open on ${pl.label}</a>`
        : `<div class="conn plain">${badge(pl.id, pl.mono)} ${pl.label}: <b>${esc(h)}</b></div>`;
    }).join("");
    $("out").innerHTML = `
      <div class="deck"><div class="swipecard" id="card">${passHtml(d, { shared, label: "Campus pass", links: `<p class="lbl">Say hi on</p><div id="conns">${links || '<p class="hint">No links shared.</p>'}</div>` })}</div></div>
      <p class="swipehint">${icon("left", 18)} Swipe left or right for the next student ${icon("right", 18)}</p>
      <div style="text-align:center;margin-top:8px"><button class="btn ghost" id="share">${icon("share", 18)} Share FAF</button></div>
      ${shownCount % 8 === 0 ? adHtml() : ""}`;
    $("share").onclick = share;
    $("conns").onclick = (e) => { if (e.target.closest(".conn")) track("external_social_clicked", ["connectClicks"]); };
    attachSwipe($("card"));
    if (shownCount % 8 === 0) mountAd();
    if (shownCount === 1) $("out").scrollIntoView({ behavior: "smooth", block: "start" });
    else if ($("out").getBoundingClientRect().top < 0) $("out").scrollIntoView({ block: "start" });
  }

  function attachSwipe(el) {
    let sx = 0, sy = 0, dx = 0, dragging = false, moved = false, pid = null;
    el.addEventListener("pointerdown", (e) => {
      if (e.target.closest("a, button, .conn")) return;           // links stay tappable
      dragging = true; moved = false; sx = e.clientX; sy = e.clientY; dx = 0; pid = e.pointerId;
      el.style.transition = "none";
    });
    el.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      dx = e.clientX - sx; const dy = e.clientY - sy;
      if (!moved && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) { moved = true; try { el.setPointerCapture(pid); } catch (er) {} }
      if (!moved) return;
      el.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
      el.style.opacity = String(1 - Math.min(Math.abs(dx) / 420, 0.45));
    });
    const end = () => {
      if (!dragging) return; dragging = false;
      try { el.releasePointerCapture(pid); } catch (er) {}
      if (moved && Math.abs(dx) > 90) advance(dx > 0 ? 1 : -1);
      else { el.style.transition = "transform .2s, opacity .2s"; el.style.transform = ""; el.style.opacity = ""; }
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  }
</script>
</body>
</html>
