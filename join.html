<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join FAF</title>
  <meta name="theme-color" content="#F4F6FB">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FAF">
  <script>window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__bip=e;});</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <a class="logo" href="index.html">FAF</a>
  <h1 class="pagehead" style="font-size:38px;margin-top:34px">Let's get you in.</h1>
  <p class="sub">Sign in with Google, then set up your student profile. It takes about two minutes.</p>
  <label class="agree"><input type="checkbox" id="is18"><span>I'm <b>18 or older</b> and I'm a student in India.</span></label>
  <label class="agree"><input type="checkbox" id="terms"><span>I agree to the <a href="legal.html#terms">Terms</a> and <a href="legal.html#privacy">Privacy Policy</a>.</span></label>
  <button class="btn dark" id="go" disabled>
    <svg class="gicon" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    <span id="goTxt">Continue with Google</span>
  </button>
  <p class="error" id="err" role="alert"></p>
  <p class="hint" style="margin-top:18px">We never post anything or see your Google password.</p>
</main>
<script type="module">
  import "./install.js";
  import { signInWithGoogle, watchUser } from "./firebase.js";
  const a = document.getElementById("is18"), b = document.getElementById("terms");
  const btn = document.getElementById("go"), err = document.getElementById("err"), txt = document.getElementById("goTxt");
  const sync = () => btn.disabled = !(a.checked && b.checked);
  a.addEventListener("change", sync); b.addEventListener("change", sync);
  btn.addEventListener("click", async () => {
    btn.disabled = true; txt.textContent = "Signing in..."; err.textContent = "";
    try { await signInWithGoogle(); location.href = "home.html"; }
    catch (e) {
      console.error(e);
      err.textContent = e && e.code === "auth/popup-closed-by-user" ? "The Google window was closed. Tap the button to try again." : "Sign-in didn't work. Check your connection and try again.";
      txt.textContent = "Continue with Google"; sync();
    }
  });
  watchUser((u) => { if (u) location.href = "home.html"; });
</script>
</body>
</html>
